name: Feature request
description: Propose a bounded, evidence-backed improvement
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete limitation should be addressed?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Acceptance evidence
      description: Define what artifact or test would prove completion and what it would not prove.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Affected boundary
      options:
        - Candidate plugin
        - Controller or journal
        - Provider adapter
        - Evaluator or benchmark
        - Release or documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I am not treating an engineering test as a benchmark-improvement claim.
          required: true
        - label: I understand trust-boundary or protocol changes require an ADR and a fresh lineage.
          required: true
