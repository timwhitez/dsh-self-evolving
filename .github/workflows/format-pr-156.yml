name: format-pr-156

on:
  push:
    branches:
      - fix/issue-59-honor-max-tokens

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-59-honor-max-tokens
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Format changed files and remove helper
        run: |
          pnpm exec prettier --write \
            packages/dsh-self-evolving-proposer/src/chat-completions-adapter.ts \
            packages/dsh-self-evolving-proposer/src/responses-adapter.ts \
            packages/dsh-self-evolving-proposer/tests/chat-completions-adapter.test.ts \
            packages/dsh-self-evolving-proposer/tests/responses-adapter.test.ts
          rm .github/workflows/format-pr-156.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'style(proposer): format token-limit patch'
          git push origin HEAD:fix/issue-59-honor-max-tokens
