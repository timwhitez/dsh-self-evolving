name: sync-pr-160

on:
  push:
    branches:
      - fix/issue-68-bound-bootstrap-resamples

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-68-bound-bootstrap-resamples
          fetch-depth: 0
      - name: Merge current main, preserve both Gate 8 regressions, and remove this helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          conflicts="$(git diff --name-only --diff-filter=U)"
          expected='packages/dsh-self-evolving-search/tests/gate8-acceptance.test.ts'
          if [ "$conflicts" != "$expected" ]; then
            echo "unexpected merge conflicts: $conflicts" >&2
            exit 1
          fi
          git checkout --ours -- "$expected"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/dsh-self-evolving-search/tests/gate8-acceptance.test.ts')
          text = path.read_text()
          anchor = "  it('rejects non-finite, fractional, underpowered, and excessive bootstrap counts', () => {\n"
          block = """  it('rejects every non-binary runtime reward before statistical analysis', () => {
            for (const reward of [-1, 0.5, 2, Number.NaN, Number.POSITIVE_INFINITY]) {
              const sealed = complete()
              ;(sealed.sealedTrials[0] as unknown as { reward: number }).reward = reward
              sealed.reportedPromotionState = 'PROTOCOL_INVALID'
              sealed.fullSet = null
              sealed.release = null
              const sealedVerdict = verifyGate8Evidence(sealed)
              expect(sealedVerdict.protocolValid).toBe(false)
              expect(sealedVerdict.reasons.join('\\n')).toMatch(/sealed trial identity\\/artifact invalid/)

              const full = complete()
              ;(full.fullSet!.trials[0] as unknown as { reward: number }).reward = reward
              const fullVerdict = verifyGate8Evidence(full)
              expect(fullVerdict.fullSetVerified).toBe(false)
              expect(fullVerdict.reasons.join('\\n')).toMatch(/full-set trial identity\\/artifact invalid/)
            }
          })

          """
          if anchor not in text:
              raise SystemExit('bootstrap regression anchor missing')
          if "rejects every non-binary runtime reward" not in text:
              text = text.replace(anchor, block + anchor, 1)
          path.write_text(text)
          PY
          git add "$expected"
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo 'unresolved merge conflicts remain' >&2
            exit 1
          fi
          rm .github/workflows/sync-pr-160.yml
          git add -A
          git diff --cached --check
          git commit -m 'merge main into fix/issue-68-bound-bootstrap-resamples'
          git push origin HEAD:fix/issue-68-bound-bootstrap-resamples
