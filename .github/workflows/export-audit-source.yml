name: export-audit-source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source
        run: git archive --format=tar.gz --output=/tmp/dsh-self-evolving-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-self-evolving-source
          path: /tmp/dsh-self-evolving-source.tar.gz
          if-no-files-found: error
          retention-days: 1
