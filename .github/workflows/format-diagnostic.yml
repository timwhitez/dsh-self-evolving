name: format-diagnostic

on:
  push:
    branches:
      - fix/issue-47-stable-capability-ledger-order
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Enable Bubblewrap on the ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Materialize pinned source closure
        run: pnpm setup:source

      - name: Capture formatter diagnostics
        shell: bash
        run: |
          set +e
          pnpm exec prettier --check . > format-check.log 2>&1
          check_status=$?
          pnpm exec prettier --list-different . > format-files.txt 2>&1
          list_status=$?
          git status --short > git-status.txt
          git diff --name-only > git-diff-files.txt
          printf 'check_status=%s\nlist_status=%s\n' "$check_status" "$list_status" > format-status.txt
          cat format-check.log
          cat format-files.txt
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: format-diagnostic
          path: |
            format-check.log
            format-files.txt
            format-status.txt
            git-status.txt
            git-diff-files.txt
          if-no-files-found: error
