name: apply-issue-44

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-44-bind-lock-protocol

      - name: Apply audited protocol binding patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('packages/dsh-self-evolving-sealed-service/src/service.ts')
          source = source_path.read_text()
          needle = """    if (
            resolve(request.privateDir) !== state.privateDir ||
            resolve(request.publicDir) !== state.publicDir
          ) {
            throw new Error('INVALID_LAYOUT: lock request does not match ceremony layout')
          }
          await prepareDirs(state.privateDir, state.publicDir)
          """
          replacement = """    if (
            resolve(request.privateDir) !== state.privateDir ||
            resolve(request.publicDir) !== state.publicDir
          ) {
            throw new Error('INVALID_LAYOUT: lock request does not match ceremony layout')
          }
          if (request.identity.protocolHash !== state.protocolHash) {
            throw new Error('INVALID_LOCK: protocolHash does not match sealed ceremony')
          }
          await prepareDirs(state.privateDir, state.publicDir)
          """
          if source.count(needle) != 1:
              raise SystemExit(f'expected one lockCandidate insertion point; got {source.count(needle)}')
          source_path.write_text(source.replace(needle, replacement))

          test_path = Path('packages/dsh-self-evolving-sealed-service/tests/service.test.ts')
          tests = test_path.read_text()
          marker = "  it('rejects private-state tampering before authorization', async () => {\n"
          regression = """  it('binds the candidate lock to the protocol sealed by the ceremony', async () => {
            const f = await fixture()
            await handleServiceRequest(f.request)
            const statePath = join(f.privateDir, 'ceremony-state.json')
            const receiptPath = join(f.publicDir, 'candidate-lock.json')
            const stateBefore = await readFile(statePath, 'utf8')
            const foreignProtocolIdentity = {
              ...lockIdentity(),
              protocolHash: digest('foreign-protocol'),
            }

            await expect(
              handleServiceRequest({
                operation: 'lock',
                privateDir: f.privateDir,
                publicDir: f.publicDir,
                identity: foreignProtocolIdentity,
              }),
            ).rejects.toThrow(/protocolHash does not match sealed ceremony/)

            await expect(readFile(statePath, 'utf8')).resolves.toBe(stateBefore)
            await expect(readFile(receiptPath, 'utf8')).rejects.toMatchObject({ code: 'ENOENT' })
            await expect(
              handleServiceRequest({
                operation: 'lock',
                privateDir: f.privateDir,
                publicDir: f.publicDir,
                identity: lockIdentity(),
              }),
            ).resolves.toMatchObject({ operation: 'lock', idempotent: false })
          })

          """
          if tests.count(marker) != 1:
              raise SystemExit('expected one service regression insertion point')
          test_path.write_text(tests.replace(marker, regression + marker))
          PY

      - name: Publish final branch without helper workflow
        run: |
          rm .github/workflows/apply-issue-44.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(sealed-service): bind candidate lock to ceremony protocol'
          git push origin HEAD:fix/issue-44-bind-lock-protocol
