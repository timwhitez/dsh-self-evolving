name: finalize-issue-23

on:
  push:
    branches:
      - fix/issue-23-bytes-first-atomic-publish

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-23-bytes-first-atomic-publish
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - uses: astral-sh/setup-uv@v6

      - name: Close read-side recovery races
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/dsh-self-evolving/src/object-store/store.ts')
          text = path.read_text()
          old_read = """  let metadata: StoredObjectMetadata
            try {
              metadata = await readMetadata(store, digest)
            } catch (error) {
              if ((await stat(metadataPath(store.root, digest)).catch(() => null)) === null) {
                throw new IncompleteObjectPublishError(digest)
              }
              throw error
            }
          """
          new_read = """  let metadata: StoredObjectMetadata
            try {
              metadata = await readMetadata(store, digest)
            } catch {
              if ((await stat(metadataPath(store.root, digest)).catch(() => null)) === null) {
                throw new IncompleteObjectPublishError(digest)
              }
              // Metadata may have been atomically linked between the failed read
              // and the existence probe. Retry the complete immutable record.
              metadata = await readMetadata(store, digest)
            }
          """
          if old_read not in text:
              raise SystemExit('read metadata recovery anchor missing')
          text = text.replace(old_read, new_read, 1)

          old_ref = """export async function readRefBytes(store: ObjectStore, ref: ObjectRef): Promise<Uint8Array> {
            if (ref.algorithm !== 'sha256') throw new Error('object-store: unsupported reference algorithm')
            const metadata = await readMetadata(store, ref.digest)
            if (JSON.stringify(metadata) !== JSON.stringify(createMetadata(ref))) {
              throw new Error(`EVIDENCE_CORRUPT: reference metadata mismatch for object ${ref.digest}`)
            }
            return readBytes(store, ref.digest)
          }
          """
          new_ref = """export async function readRefBytes(store: ObjectStore, ref: ObjectRef): Promise<Uint8Array> {
            if (ref.algorithm !== 'sha256') throw new Error('object-store: unsupported reference algorithm')
            // Read the completed object first so a bytes-only crash state is
            // classified as retryable rather than as missing metadata corruption.
            const bytes = await readBytes(store, ref.digest)
            const metadata = await readMetadata(store, ref.digest)
            if (JSON.stringify(metadata) !== JSON.stringify(createMetadata(ref))) {
              throw new Error(`EVIDENCE_CORRUPT: reference metadata mismatch for object ${ref.digest}`)
            }
            return bytes
          }
          """
          if old_ref not in text:
              raise SystemExit('readRefBytes anchor missing')
          path.write_text(text.replace(old_ref, new_ref, 1))

          test_path = Path('packages/dsh-self-evolving/tests/object-store-bytes-first.test.ts')
          test = test_path.read_text()
          test = test.replace(
              "  publishBytes,\n  readBytes,",
              "  publishBytes,\n  readBytes,\n  readRefBytes,",
              1,
          )
          anchor = """    const ref = await publishBytes(store(), bytes, 'text/plain', 'DEV_OBSERVED')
              expect(ref.digest).toBe(digest)
          """
          replacement = """    await expect(
                readRefBytes(store(), {
                  algorithm: 'sha256',
                  digest,
                  size: bytes.byteLength,
                  mediaType: 'text/plain',
                  label: 'DEV_OBSERVED',
                }),
              ).rejects.toMatchObject({ code: 'OBJECT_PUBLISH_INCOMPLETE', digest })

              const ref = await publishBytes(store(), bytes, 'text/plain', 'DEV_OBSERVED')
              expect(ref.digest).toBe(digest)
          """
          if anchor not in test:
              raise SystemExit('bytes-only regression anchor missing')
          test_path.write_text(test.replace(anchor, replacement, 1))
          PY

          rm .github/workflows/finalize-issue-23.yml
          pnpm setup:source
          pnpm exec prettier --write \
            packages/dsh-self-evolving/src/object-store/store.ts \
            packages/dsh-self-evolving/tests/object-store-bytes-first.test.ts
          pnpm typecheck
          pnpm exec vitest run packages/dsh-self-evolving/tests/object-store-bytes-first.test.ts

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix(core): make bytes-first reads race-safe'
          git push origin HEAD:fix/issue-23-bytes-first-atomic-publish
