name: format-pr-160

on:
  push:
    branches:
      - fix/issue-68-bound-bootstrap-resamples

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-68-bound-bootstrap-resamples
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Materialize source closure and format final diff
        run: |
          pnpm setup:source
          pnpm exec prettier --write \
            packages/dsh-self-evolving-search/src/gate8-acceptance.ts \
            packages/dsh-self-evolving-search/src/index.ts \
            packages/dsh-self-evolving-search/src/stats.ts \
            packages/dsh-self-evolving-search/tests/gate8-acceptance.test.ts \
            packages/dsh-self-evolving-search/tests/tournament-split-stats.test.ts
          rm .github/workflows/format-pr-160.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'style(search): format bounded bootstrap changes'
          git push origin HEAD:fix/issue-68-bound-bootstrap-resamples
