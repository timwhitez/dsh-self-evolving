name: finalize-pr-164

on:
  push:
    branches:
      - fix/issue-31-logical-state-projection-v2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-31-logical-state-projection-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Replace test-side canonicalization with the production contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/dsh-self-evolving/tests/journal-reducer.test.ts')
          text = path.read_text()
          text = text.replace(
              "  genesisState,\n  reduce,\n  replay,\n  stateHash,",
              "  genesisState,\n  reduce,\n  replay,\n  stateHash,\n  logicalStateHash,",
              1,
          )
          start = text.index(
              "  it('event-completion-order permutation within a wave yields the same state hash'"
          )
          end_marker = "\n  })\n})\n\ndescribe('computeEventHash canonicalization'"
          end = text.index(end_marker, start) + len("\n  })")
          replacement = """  it('separates exact completion order from order-independent logical facts', () => {
            const candidateEvent: JournalEvent = {
              schemaVersion: 1,
              runId: 'r',
              seq: 1,
              eventId: 'admit',
              occurredAt: '2026-08-14T00:00:00.000Z',
              type: 'candidate.admitted',
              causationId: null,
              correlationId: 'wave',
              actor: 'test',
              payload: { candidateId: 'c_a', canonicalParent: null, donorCandidates: [] },
              previousHash: null,
              eventHash: `sha256:${'1'.repeat(64)}`,
            }
            const observations: JournalEvent[] = [
              {
                ...candidateEvent,
                seq: 2,
                eventId: 'observation-a',
                type: 'evaluation.observed',
                payload: {
                  candidateId: 'c_a',
                  taskId: 't2',
                  attemptIndex: 0,
                  status: 'pass',
                  reward: 1,
                },
                previousHash: candidateEvent.eventHash,
                eventHash: `sha256:${'2'.repeat(64)}`,
              },
              {
                ...candidateEvent,
                seq: 2,
                eventId: 'observation-b',
                type: 'evaluation.observed',
                payload: {
                  candidateId: 'c_a',
                  taskId: 't1',
                  attemptIndex: 0,
                  status: 'fail',
                  reward: 0,
                },
                previousHash: candidateEvent.eventHash,
                eventHash: `sha256:${'3'.repeat(64)}`,
              },
            ]

            let stateA = reduce(genesisState(), candidateEvent)
            stateA = reduce(stateA, observations[0]!)
            stateA = reduce(stateA, { ...observations[1]!, seq: 3, previousHash: stateA.lastEventHash })

            let stateB = reduce(genesisState(), candidateEvent)
            stateB = reduce(stateB, observations[1]!)
            stateB = reduce(stateB, { ...observations[0]!, seq: 3, previousHash: stateB.lastEventHash })

            expect(stateHash(stateA)).not.toBe(stateHash(stateB))
            expect(logicalStateHash(stateA)).toBe(logicalStateHash(stateB))
          })"""
          path.write_text(text[:start] + replacement + text[end:])
          PY

          rm .github/workflows/finalize-pr-164.yml
          pnpm setup:source
          pnpm exec prettier --write \
            packages/dsh-self-evolving/src/reducer/reducer.ts \
            packages/dsh-self-evolving/src/reducer/index.ts \
            packages/dsh-self-evolving/tests/reducer-logical-state.test.ts \
            packages/dsh-self-evolving/tests/journal-reducer.test.ts
          pnpm typecheck
          pnpm exec vitest run \
            packages/dsh-self-evolving/tests/reducer-logical-state.test.ts \
            packages/dsh-self-evolving/tests/journal-reducer.test.ts

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'test(core): enforce exact and logical hash contracts'
          git push origin HEAD:fix/issue-31-logical-state-projection-v2
