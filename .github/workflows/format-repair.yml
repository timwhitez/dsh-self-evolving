name: format-repair

on:
  push:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed source files
        shell: bash
        run: |
          git fetch --no-tags origin main
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR origin/main...HEAD -- \
              '*.ts' '*.tsx' '*.js' '*.mjs' '*.cjs' '*.json' '*.md' '*.yml' '*.yaml'
          )
          if (( ${#files[@]} > 0 )); then
            pnpm exec prettier --write -- "${files[@]}"
            git diff --binary -- "${files[@]}" > formatted.patch
            printf '%s\0' "${files[@]}" | tar --null -czf formatted-files.tgz --files-from=-
          else
            : > formatted.patch
            tar -czf formatted-files.tgz --files-from=/dev/null
          fi

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-${{ github.sha }}
          path: |
            formatted.patch
            formatted-files.tgz
          if-no-files-found: error
          retention-days: 1
