name: format-pr-164

on:
  push:
    branches:
      - fix/issue-31-logical-state-projection-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-31-logical-state-projection-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Bootstrap and format final reducer identity diff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/bootstrap-upstreams.mjs
          node scripts/bootstrap-references.mjs
          pnpm setup:source
          pnpm exec prettier --write \
            packages/dsh-self-evolving/src/reducer/reducer.ts \
            packages/dsh-self-evolving/src/reducer/index.ts \
            packages/dsh-self-evolving/tests/reducer-logical-state.test.ts \
            packages/dsh-self-evolving/tests/journal-reducer.test.ts
          rm .github/workflows/format-pr-164.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'style(core): format logical state identity'
          git push origin HEAD:fix/issue-31-logical-state-projection-v2
