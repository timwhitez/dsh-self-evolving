name: gate0

# Gate 0 CI (spec 07 §12). Every PR must pass:
#   format / lint / typecheck
#   schema compatibility (via typecheck + unit)
#   unit + property tests
#   real Cordis Loader E2E
#   upstream worktrees unchanged
#   AGENTS/CLAUDE byte equality
#   provenance lock machine-verifiable
#
# The Loader E2E boots a real @deepseek-ai/cordis-plugin-loader against a
# cordis.yml fixture, so a candidate with `export default apply` is caught here,
# not in a paid benchmark run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The three upstreams are pinned checkouts inside this repo; fetch them.
          submodules: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: Install root workspace
        run: pnpm install --frozen-lockfile

      - name: Build DSH upstream (read-only)
        run: |
          cd deepseek-harness
          pnpm install --frozen-lockfile
          pnpm build:lib:host

      - name: Build RSI packages
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Provenance lock
        run: pnpm provenance:check

      - name: Upstream worktrees clean
        run: pnpm upstream:check

      - name: AGENTS/CLAUDE byte equality
        run: pnpm byteequal:check

  loader-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: fast-ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: pnpm

      - name: Install root workspace
        run: pnpm install --frozen-lockfile

      - name: Build DSH upstream (read-only)
        run: |
          cd deepseek-harness
          pnpm install --frozen-lockfile
          pnpm build:lib:host

      - name: Build RSI packages
        run: pnpm build

      - name: Real Cordis Loader E2E (boot → unload → quiescence + negative fixture)
        run: pnpm test:e2e
