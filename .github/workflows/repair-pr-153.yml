name: repair-pr-153

on:
  push:
    branches:
      - fix/issue-44-bind-lock-protocol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-44-bind-lock-protocol
      - name: Repair exact generated block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/dsh-self-evolving-sealed-service/src/service.ts')
          text = path.read_text()
          old = """    if (request.identity.protocolHash !== state.protocolHash) {
              throw new Error('INVALID_LOCK: protocolHash does not match sealed ceremony')
            }
            await prepareDirs(state.privateDir, state.publicDir)
            if (state.candidateLock !== null) {
          """
          new = """    if (request.identity.protocolHash !== state.protocolHash) {
                throw new Error('INVALID_LOCK: protocolHash does not match sealed ceremony')
              }
              await prepareDirs(state.privateDir, state.publicDir)
              if (state.candidateLock !== null) {
          """
          if old not in text:
              raise SystemExit('expected malformed block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/repair-pr-153.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'style(sealed-service): repair protocol-lock indentation'
          git push origin HEAD:fix/issue-44-bind-lock-protocol