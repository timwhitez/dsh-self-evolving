name: fix-format-153

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-44-bind-lock-protocol

      - name: Repair deterministic formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('packages/dsh-self-evolving-sealed-service/src/service.ts')
          source = source_path.read_text()
          malformed = """    if (request.identity.protocolHash !== state.protocolHash) {
              throw new Error('INVALID_LOCK: protocolHash does not match sealed ceremony')
            }
            await prepareDirs(state.privateDir, state.publicDir)
            if (state.candidateLock !== null) {
          """
          malformed = malformed.replace('      throw', 'throw').replace('    }', '}').replace('    await', 'await').replace('    if (state.candidateLock', 'if (state.candidateLock')
          fixed = """    if (request.identity.protocolHash !== state.protocolHash) {
              throw new Error('INVALID_LOCK: protocolHash does not match sealed ceremony')
            }
            await prepareDirs(state.privateDir, state.publicDir)
            if (state.candidateLock !== null) {
          """
          if source.count(malformed) != 1:
              raise SystemExit(f'expected malformed service block once; got {source.count(malformed)}')
          source_path.write_text(source.replace(malformed, fixed))

          test_path = Path('packages/dsh-self-evolving-sealed-service/tests/service.test.ts')
          tests = test_path.read_text()
          start = tests.index("  it('binds the candidate lock to the protocol sealed by the ceremony'")
          end = tests.index("\n\n  it('rejects private-state tampering before authorization'", start)
          fixed_test = """  it('binds the candidate lock to the protocol sealed by the ceremony', async () => {
            const f = await fixture()
            await handleServiceRequest(f.request)
            const statePath = join(f.privateDir, 'ceremony-state.json')
            const receiptPath = join(f.publicDir, 'candidate-lock.json')
            const stateBefore = await readFile(statePath, 'utf8')
            const foreignProtocolIdentity = {
              ...lockIdentity(),
              protocolHash: digest('foreign-protocol'),
            }

            await expect(
              handleServiceRequest({
                operation: 'lock',
                privateDir: f.privateDir,
                publicDir: f.publicDir,
                identity: foreignProtocolIdentity,
              }),
            ).rejects.toThrow(/protocolHash does not match sealed ceremony/)

            await expect(readFile(statePath, 'utf8')).resolves.toBe(stateBefore)
            await expect(readFile(receiptPath, 'utf8')).rejects.toMatchObject({ code: 'ENOENT' })
            await expect(
              handleServiceRequest({
                operation: 'lock',
                privateDir: f.privateDir,
                publicDir: f.publicDir,
                identity: lockIdentity(),
              }),
            ).resolves.toMatchObject({ operation: 'lock', idempotent: false })
          })"""
          test_path.write_text(tests[:start] + fixed_test + tests[end:])
          PY

      - name: Publish final source and remove helper
        run: |
          rm .github/workflows/fix-format-153.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'style(sealed-service): format protocol-lock regression'
          git push origin HEAD:fix/issue-44-bind-lock-protocol
